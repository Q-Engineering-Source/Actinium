plugins {
    id 'java-library'
}

import java.util.Locale

repositories {
    // JMH (jmhImplementation) resolves from Maven Central; main code has no external Maven deps.
    mavenCentral()
}

// The GL benchmarks use surfaceless EGL. Windows x64 gets a Mesa runtime from src/jmh/natives so JMH needs no
// separately installed EGL implementation there; other platforms use their system EGL runtime.
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def osArchitecture = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def osKey
if (osName.startsWith('windows')) {
    osKey = 'windows'
} else if (osName.startsWith('linux')) {
    osKey = 'linux'
} else if (osName.startsWith('mac')) {
    osKey = 'macos'
} else {
    throw new GradleException("Unsupported jmh platform: ${osName}/${osArchitecture}")
}

def nativeClassifiers = [
    windows: [
        amd64: 'natives-windows',
        x86_64: 'natives-windows',
        x64: 'natives-windows',
        x86: 'natives-windows-x86',
        i386: 'natives-windows-x86',
        i486: 'natives-windows-x86',
        i586: 'natives-windows-x86',
        i686: 'natives-windows-x86',
        aarch64: 'natives-windows-arm64',
        arm64: 'natives-windows-arm64'
    ],
    linux: [
        amd64: 'natives-linux',
        x86_64: 'natives-linux',
        x64: 'natives-linux',
        arm: 'natives-linux-arm32',
        arm32: 'natives-linux-arm32',
        aarch32: 'natives-linux-arm32',
        armv7l: 'natives-linux-arm32',
        aarch64: 'natives-linux-arm64',
        arm64: 'natives-linux-arm64',
        ppc64le: 'natives-linux-ppc64le',
        riscv64: 'natives-linux-riscv64'
    ],
    macos: [
        amd64: 'natives-macos',
        x86_64: 'natives-macos',
        x64: 'natives-macos',
        aarch64: 'natives-macos-arm64',
        arm64: 'natives-macos-arm64'
    ]
]
def lwjglNatives = nativeClassifiers[osKey][osArchitecture]
if (lwjglNatives == null) {
    throw new GradleException("Unsupported jmh platform: ${osName}/${osArchitecture}")
}

def lwjglVersion = '3.4.1'
def mesaEglArchive = layout.projectDirectory.file('src/jmh/natives/mesa-windows-x64.zip')
def mesaEglDirectory = layout.buildDirectory.dir('jmh/mesa-windows-x64')

def unpackMesaEglRuntime = tasks.register('unpackMesaEglRuntime', Copy) {
    group = 'verification'
    description = 'Extracts the bundled Mesa EGL runtime for Windows JMH benchmarks.'
    from(zipTree(mesaEglArchive))
    into(mesaEglDirectory)
}

sourceSets {
    jmh {
        compileClasspath += main.output
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.output
        runtimeClasspath += main.runtimeClasspath
    }
}

// The benchmarks run against main's code, so the jmh source set needs main's dependencies too.
configurations {
    jmhImplementation.extendsFrom(implementation)
    jmhRuntimeOnly.extendsFrom(runtimeOnly)
}

dependencies {
    api project(':glsm')

    jmhImplementation "org.openjdk.jmh:jmh-core:${jmh_version}"
    jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmh_version}"

    // LWJGL 3.4.1 bindings for the headless EGL benchmark context. EGL itself is supplied by the system or the
    // JMH-only Mesa runtime; lwjgl-egl publishes no natives classifier.
    jmhImplementation platform("org.lwjgl:lwjgl-bom:${lwjglVersion}")
    jmhImplementation "org.lwjgl:lwjgl:${lwjglVersion}"
    jmhImplementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    jmhImplementation "org.lwjgl:lwjgl-egl:${lwjglVersion}"
    jmhRuntimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:${lwjglNatives}"
    jmhRuntimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:${lwjglNatives}"
    // The game supplies these to production code; standalone JMH needs them on its own runtime classpath.
    jmhRuntimeOnly 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    jmhRuntimeOnly 'it.unimi.dsi:fastutil:8.5.18'
    jmhRuntimeOnly 'org.joml:joml:1.10.5'
}

// Run the benchmarks through Gradle. Any JMH argument can be passed through, e.g.
//   ./gradlew :celeritas-common:jmh -Pjmhargs="-f 1 -p renderDistance=64"
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Runs the JMH benchmarks.'

    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    args '-foe', 'true'

    def mesaEglRuntimePath
    if (osKey == 'windows') {
        if (!['amd64', 'x86_64', 'x64'].contains(osArchitecture)) {
            throw new GradleException("Bundled Mesa EGL benchmark runtime supports Windows x64, not ${osArchitecture}")
        }

        dependsOn(unpackMesaEglRuntime)
        mesaEglRuntimePath = mesaEglDirectory.get().asFile.absolutePath
        environment 'PATH', "${mesaEglRuntimePath}${File.pathSeparator}${System.getenv('PATH')}"
        environment 'GALLIUM_DRIVER', 'llvmpipe'
        jvmArgs "-Djava.library.path=${mesaEglRuntimePath}"
    }

    doFirst {
        if (mesaEglRuntimePath != null) {
            def requiredMesaFiles = ['libEGL.dll', 'libgallium_wgl.dll', 'opengl32.dll']
            def missingMesaFiles = requiredMesaFiles.findAll { !new File(mesaEglRuntimePath, it).isFile() }
            if (!missingMesaFiles.isEmpty()) {
                throw new GradleException("Bundled Mesa EGL runtime is missing: ${missingMesaFiles.join(', ')}")
            }
        }

        if (project.hasProperty('jmhargs')) {
            args(project.property('jmhargs').toString().split('\\s+').findAll { !it.isEmpty() })
        }
    }
}
