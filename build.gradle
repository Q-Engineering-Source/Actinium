jar {
    duplicatesStrategy = DuplicatesStrategy.FAIL

    // The manifest is written in doFirst, so Gradle snapshots the (empty) manifest before the version is applied.
    // Declare the version explicitly or the build cache can restore a jar whose Implementation-Version is stale.
    inputs.property('finalVersion', finalVersion)

    // Reading the resolved artifacts here would resolve the configuration during configuration time, which
    // the CleanroomGradle deobf wiring (afterEvaluate, withDependencies on every configuration) rejects.
    if (!configurations.contain.dependencies.isEmpty()) {
        into('/') {
            from configurations.contain
        }
    }

    doFirst {
        manifest {
            applyActiniumManifest(delegate)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    // No source/targetCompatibility: Gradle derives the compile classpath's org.gradle.jvm.version from the
    // compile task's release option, and the Cleanroom userdev only publishes JVM 25 variants.
    options.encoding = 'UTF-8'
    options.release.set(21)
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // The conditional compat mixins list alternate spellings of their targets (MCP next to SRG and notch
    // names), target mod classes that only ever carry MCP names, and use string targets for mods that may
    // be absent. The Mixin annotation processor reports each of those as an error, which fails the compile;
    // unimined's own refmap builder skipped exactly the same entries silently, so the generated refmap is
    // unchanged by downgrading the messages to warnings.
    options.compilerArgs.add('-AMSG_NO_OBFDATA_FOR_TARGET=warning')
    options.compilerArgs.add('-AMSG_NO_OBFDATA_FOR_OVERWRITE=warning')
    options.compilerArgs.add('-AMSG_MIXIN_SOFT_TARGET_NOT_FOUND=warning')
}

/**
 * LWJGLY's jar as resolved off the given configuration, so it can be subtracted from a classpath.
 *
 * LWJGLY (com.cleanroommc:lwjgly) and lwjglx both ship org.lwjgl.**. javac and the test classloader take the
 * class from the first jar that provides it, and only lwjglx's copy has the borderless extensions and the
 * GLFW-backed Display.create() the mod compiles against and transforms. LWJGLY cannot be dropped from the
 * dependency graph itself (it arrives with the userdev), so it is removed from these classpaths instead.
 * Everything else keeps the resolved order, in which LWJGL3's core classes still precede lwjglx.
 */
def lwjglyJars = { Configuration configuration ->
    configuration.incoming.artifactView { view ->
        view.componentFilter { id ->
            id instanceof ModuleComponentIdentifier &&
                id.group == 'com.cleanroommc' && id.module == 'lwjgly'
        }
    }.files
}

tasks.named('compileJava', JavaCompile).configure {
    options.fork = true
    options.forkOptions.jvmArgs.add('--sun-misc-unsafe-memory-access=allow')
    classpath = configurations.compileClasspath - lwjglyJars(configurations.compileClasspath)
}

// The test classpath needs the same treatment: MacDisplayForwardCompatTransformerTest reads the LWJGL2
// Display class off it and expects lwjglx's GLFW-backed copy. The default classpath also carries the main
// output, which the subtraction must not lose.
tasks.named('compileTestJava', JavaCompile).configure {
    classpath = sourceSets.main.output + (configurations.testCompileClasspath - lwjglyJars(configurations.testCompileClasspath))
}

def testRunDirectory = layout.projectDirectory.dir('run/test')

def prepareTestRunDirectory = tasks.register('prepareTestRunDirectory') {
    outputs.dir(testRunDirectory)
    doLast {
        mkdir(testRunDirectory)
    }
}

test {
    // Same LWJGLY subtraction as compileTestJava: MacDisplayForwardCompatTransformerTest reads the
    // Display class off this classpath and expects lwjglx's GLFW-backed copy.
    classpath = sourceSets.test.runtimeClasspath - lwjglyJars(configurations.testRuntimeClasspath)
    systemProperty 'actinium.projectRoot', rootProject.projectDir.absolutePath
    dependsOn prepareTestRunDirectory
    useJUnitPlatform()
    workingDir = testRunDirectory.asFile
    javaLauncher = javaToolchains.launcherFor {
