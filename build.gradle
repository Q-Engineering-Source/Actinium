    project(':GTNHLib'),
    project(':glsm'),
    project(':celeritas-common'),
    project(':shader'),
    project(':sdl-gpu')
]

def mergedEmbeddedLibraryClassesDir = layout.buildDirectory.dir('embedded-library-classes/main')

/**
 * Access transformer applied to Minecraft in this project and in every embedded module, so all of them
 * see the same member visibility. Null when use_access_transformer is off.
 */
ext.actiniumAccessTransformer = propertyBool('use_access_transformer')
    ? new File(rootProject.projectDir, "src/main/resources/${propertyString('access_transformer_locations')}")
    : null

def mergeEmbeddedLibraryClasses = tasks.register('mergeEmbeddedLibraryClasses', Sync) {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    dependsOn tasks.named('compileJava')
    dependsOn embeddedLibraryProjects.collect { it.tasks.named('classes') }
    into mergedEmbeddedLibraryClassesDir

    embeddedLibraryProjects.each { libraryProject ->
        from(libraryProject.sourceSets.main.output)
    }
}

sourceSets.main.output.dir(mergedEmbeddedLibraryClassesDir, builtBy: mergeEmbeddedLibraryClasses)

subprojects {
    apply plugin: 'java-library'
    group = rootProject.group
    version = rootProject.version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        // See the root project: the userdev dependency publishes JVM 25 variants only, and
        // source/targetCompatibility would set org.gradle.jvm.version to 21 on every classpath.
        // The modules keep producing Java 21 bytecode through options.release.
    }

    dependencies {
        // Compile-time libraries every embedded module shares. The Minecraft classpath is not shared any
        // more: each subproject declares its own Cleanroom userdev dependency in its build.gradle, which
        // also brings the org.lwjgl.** LWJGL2 API these modules use alongside LWJGL3's.
        compileOnly 'org.jetbrains:annotations:24.1.0'
        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        compileOnly 'org.apache.logging.log4j:log4j-api:2.0-beta9'
        compileOnly 'it.unimi.dsi:fastutil:8.5.18'
        compileOnly 'org.joml:joml:1.10.5'
        compileOnly "org.ow2.asm:asm:${asmVersion}"
        compileOnly "org.ow2.asm:asm-commons:${asmVersion}"
        compileOnly "org.ow2.asm:asm-tree:${asmVersion}"
        compileOnly "org.ow2.asm:asm-util:${asmVersion}"
    }

    configurations.configureEach {
        // The Cleanroom userdev tree pins joml 1.10.9, while the distributed jar carries 1.10.5 both
        // relocated in the jar body and as the nested ContainedDeps jar, so every module compiles
        // against the version that actually ships.
        resolutionStrategy.force 'org.joml:joml:1.10.5'
    }

    tasks.withType(JavaCompile).configureEach {
        // No source/targetCompatibility here either: Gradle derives the compile classpath's
        // org.gradle.jvm.version from the compile task, and the userdev only publishes JVM 25.
        options.encoding = 'UTF-8'
        options.release.set(21)
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.named('compileJava', JavaCompile).configure {
        options.fork = true
        options.forkOptions.jvmArgs.add('--sun-misc-unsafe-memory-access=allow')
    }

    tasks.withType(Javadoc).configureEach {
        failOnError = false
    }
}

repositories {
    // CleanroomGradle injects Maven Central, CleanroomMC (exclusive for the CleanroomMC/Forge/MCP groups)
    // and Mojang into every project before its buildscript runs; these are the sources it does not cover.
    maven { url = 'https://curse.cleanroommc.com' }
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    // Not exclusive on purpose: the injected rule only exposes the CleanroomMC-owned groups from this
    // repository, and artifacts of other groups (codechicken) live here as well.
    maven { url = 'https://maven.cleanroommc.com' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
