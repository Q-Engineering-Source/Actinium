import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.attributes.java.TargetJvmVersion
import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'com.cleanroommc.cleanroomgradle'
}

apply from: 'gradle/scripts/helpers.gradle'

allprojects { evaluatedProject ->
    // LWJGL2's API surface is compiled against through com.cleanroommc:lwjglx, which is published on GTNH's
    // mirror only. CleanroomGradle's exclusive-content rule pins the whole com.cleanroommc group to
    // maven.cleanroommc.com and a second rule for the group replaces the first one, so the jar is fetched
    // here as a bare artifact under a synthetic group that no other rule claims.
    evaluatedProject.repositories {
        ivy {
            name = 'ArcseekersLwjglx'
            url = 'https://maven.arcseekers.com/releases'
            patternLayout {
                artifact 'com/cleanroommc/lwjglx/[revision]/lwjglx-[revision].jar'
            }
            metadataSources {
                artifact()
            }
            content {
                includeModule 'lwjglx.compat', 'lwjglx'
            }
        }
    }

    // afterEvaluate: the Java plugin sets the attribute from the compile task's release option when the
    // configuration is realized, and its callback has to run before this one.
    evaluatedProject.afterEvaluate {
        evaluatedProject.configurations.configureEach { configuration ->
            if (!configuration.canBeResolved) {
                return
            }
            // Minecraft, the loader, the Mixin runtime and everything else the userdev brings are Java 25
            // class files, while the mod still emits Java 21 bytecode (options.release on every JavaCompile
            // task). Gradle derives a classpath's org.gradle.jvm.version from that release option, so the
            // version the userdev variants publish has to be declared here or nothing on the Minecraft
            // classpath resolves. Lower producer versions still match through the compatibility rule.
            configuration.attributes {
                attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
            }
        }
    }
}

assertProperty 'mod_version'
assertProperty 'root_package'
assertProperty 'mod_id'
assertProperty 'mod_name'
assertSubProperties 'use_access_transformer', 'access_transformer_locations'
assertSubProperties 'is_coremod', 'coremod_includes_mod', 'coremod_plugin_class_name'

setDefaultProperty 'generate_sources_jar', true, true
setDefaultProperty 'generate_javadocs_jar', true, false
setDefaultProperty 'minecraft_username', true, 'Developer'
setDefaultProperty 'extra_jvm_args', false, ''

def cliProjectProperties = gradle.startParameter.projectProperties

/**
 * Derives the build version from git: an exact tag on HEAD wins, otherwise the short commit sha.
 * Returns null when git is unavailable (e.g. building from a source snapshot).
 */
def gitRun = { List<String> cmd ->
    // ProcessBuilder instead of Gradle exec: exec is forbidden during the configuration phase.
    try {
        def process = new ProcessBuilder(cmd)
            .directory(rootProject.projectDir)
            .redirectErrorStream(true)
            .start()
        def output = process.inputStream.text.trim()
        process.waitFor()
        return process.exitValue() == 0 && !output.isEmpty() ? output : null
    } catch (Exception ignored) {
        return null
    }
}

def gitExactTag = { gitRun(['git', 'describe', '--tags', '--exact-match', 'HEAD']) }

def gitShortSha = { gitRun(['git', 'rev-parse', '--short', 'HEAD']) }

// The most recent tag reachable from HEAD (git describe --tags --abbrev=0), used to keep the
// version prefix in sync with the latest release tag when HEAD is not exactly on a tag.
def gitClosestTag = { gitRun(['git', 'describe', '--tags', '--abbrev=0', 'HEAD']) }

def baseVersion = propertyString('mod_version')

// Precedence: explicit -Pversion > exact git tag on HEAD > "<closest tag>-<git sha>"
// > "baseVersion-gitSha" > gradle.properties mod_version.
// Appending the sha to the manual base version keeps FML version parsing (required-after
// comparisons, update checks) working: a bare sha is not a valid version for those consumers.
def finalVersion = cliProjectProperties.containsKey('version')
    ? cliProjectProperties['version']
    : (gitExactTag()
        ?: (gitShortSha() && gitClosestTag() ? gitClosestTag() + "-" + gitShortSha() : null)
        ?: (gitShortSha() ? baseVersion + "-" + gitShortSha() : baseVersion))
version = finalVersion
group = cliProjectProperties.containsKey('group') ? cliProjectProperties['group'] : propertyString('root_package')

base {
    archivesName = propertyString('mod_name')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // No source/targetCompatibility: the Cleanroom userdev dependency only publishes JVM 25 variants, and
    // those two properties are what Gradle derives the compile classpath's org.gradle.jvm.version from.
    // The bytecode target stays 21 through options.release on every JavaCompile task.
    if (propertyBool('generate_sources_jar')) {
        withSourcesJar()
    }
    if (propertyBool('generate_javadocs_jar')) {
        withJavadocJar()
    }
}

