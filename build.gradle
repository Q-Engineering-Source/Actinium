dependencies {
    // Minecraft, the loader and the Mixin runtime for the whole project tree. The mod does not ship any of
    // it, but tests and the dev runtime need it on the classpath like a normal dependency.
    implementation cleanroom.userdev(propertyString('cleanroom_version')) {
        if (rootProject.ext.actiniumAccessTransformer != null) {
            accessTransformers.from(rootProject.ext.actiniumAccessTransformer)
        }
    }

    compileOnly project(':celeritas-common')
    compileOnly project(':shader')
    compileOnly project(':sdl-gpu')
    // The sdl-gpu classes are embedded into the mod jar (LaunchClassLoader), but its backend is
    // not registered for backend selection right now. The SDL libraries stay on the runtime
    // classpath so the sdl-gpu module and a future re-wiring of the backend can load them through
    // the app loader like LWJGL itself.
    runtimeOnly "org.lwjgl:lwjgl-sdl:${lwjglVersion}"
    runtimeOnly "org.lwjgl:lwjgl-spvc:${lwjglVersion}"
    runtimeOnly "org.lwjgl:lwjgl-shaderc:${lwjglVersion}"
    ['windows', 'linux', 'macos'].each { platform ->
        runtimeOnly "org.lwjgl:lwjgl-sdl:${lwjglVersion}:natives-$platform"
        runtimeOnly "org.lwjgl:lwjgl-spvc:${lwjglVersion}:natives-$platform"
        runtimeOnly "org.lwjgl:lwjgl-shaderc:${lwjglVersion}:natives-$platform"
    }
    // Declare test dependencies explicitly so IDEA sees the embedded source modules as well.
    // Gradle's merged main output alone is not a test-module dependency in the IDE model.
    testImplementation project(':celeritas-common')
    testImplementation project(':shader')
    // The SDL GPU capabilities shim lets tests that only need native memory (or capability flags)
    // run without a GL context.
    testImplementation project(':sdl-gpu')
    // glsm-side tests live in this project (the glsm module has no test source set), so the shared
    // glsm test fixtures (Reflect, GLCoreTest, ...) must be on the test classpath.
    testImplementation testFixtures(project(':glsm'))
    // The vanilla client resources (assets, ...) sit in the userdev's client-extra jar, which the plugin
    // only puts on compileOnly. Tests that read game resources need it on their own classpath.
    testCompileOnly files(configurations._cleanroomUserdevClientExtra)
    testRuntimeOnly files(configurations._cleanroomUserdevClientExtra)
    // LWJGL's platform natives. The modules' tests exercise client-side paths that load them, and the
    // userdev publishes exactly the set for this machine.
    testRuntimeOnly files(configurations._cleanroomUserdevNatives)

    contain('org.taumc:glsl-transformation-lib:0.2.0-32.g7dd88a4-GTNH') {
        transitive = false
        exclude module: 'antlr4'
    }
    contain 'org.antlr:antlr4-runtime:4.13.2'
}

// The tests compile and run against the mods Actinium itself only compiles against: their API types appear
// in several world and render tests, and neither testCompileOnly nor testRuntimeOnly inherits compileOnly.
configurations.testCompileOnly.extendsFrom(configurations.compileOnly)
configurations.testRuntimeOnly.extendsFrom(configurations.compileOnly)

/**
 * Manifest attributes every jar that ships as a mod carries: the Cleanroom mod type, the version, the
 * flattened contained dependency list and the coremod / access transformer entries FML reads at startup.
 * Applied in each jar task's doFirst, so it is written whenever the task actually runs.
 */
def applyActiniumManifest = { manifest ->
    manifest.attributes('ModType': 'CRL', 'Implementation-Version': finalVersion)
    if (!configurations.contain.dependencies.isEmpty()) {
        manifest.attributes('ContainedDeps': configurations.contain.files.collect { it.name }.join(' '),
                'NonModDeps': true)
    }
    if (propertyBool('is_coremod')) {
        manifest.attributes('FMLCorePlugin': propertyString('coremod_plugin_class_name'), 'ForceLoadAsMod': 'true')
        if (propertyBool('coremod_includes_mod')) {
            manifest.attributes('FMLCorePluginContainsFMLMod': true)
        }
    }
    if (propertyBool('use_access_transformer')) {
        manifest.attributes('FMLAT': propertyString('access_transformer_locations').tokenize('/\\').last())
    }
}

/**
 * Dev-runtime image of the mod in the same shadow layout as the production jar: merged module
 * classes plus the shadow bundle classes relocated under
 * dhj.embeddedt.embeddium.impl.shadow.joml. The client and server runs swap the raw source-set
 * outputs and the plain joml jar for this artifact so mixin field descriptors seen at dev runtime
 * match the production distribution. The plain joml jar itself stays on the run classpath for
 * third-party mods that still speak org.joml.
 */
def devShadowJar = tasks.register('devShadowJar', ShadowJar) {
    group = 'build'
    description = 'Builds the shadow-layout dev runtime jar consumed by the client and server runs.'
    archiveBaseName.set('Actinium-dev')
    archiveClassifier.set('')
    archiveVersion.set('')
    destinationDirectory.set(layout.buildDirectory.dir('dev-libs'))
    configurations.set([project.configurations.shadowBundle])
    from(sourceSets.main.output)
    relocate('org.joml', 'dhj.embeddedt.embeddium.impl.shadow.joml')
    mergeServiceFiles()
    // Deliberately no manifest inheritance from the jar task: that manifest carries the
    // FMLCorePlugin / FMLCorePluginContainsFMLMod entries the production jar needs, but at dev time
    // the coremod is launched through the userdev run configuration instead. Letting them surface on a
    // plain classpath jar makes FML's classpath scan treat this jar as a coremod container, which
    // parent-delegates its package (class loader exclusion) and splits classes like MixinLate across
    // the app class loader and the LaunchClassLoader (ClassCastException on the mixinbooter
    // ILateMixinLoader cast).
    manifest.attributes('Implementation-Version': finalVersion)
}

/**
 * Production mod jar: the SRG-renamed jar merged with the shadow bundle classes, with joml relocated
 * under dhj.embeddedt.embeddium.impl.shadow.joml. The relocation target sits in Actinium's own
 * namespace so this bundled joml cannot class-collide with the shadow copy inside an upstream
 * Embeddium/Celeritas jar on the same class path. The ContainedDeps joml jar inherited from the
 * renamed jar stays nested for third-party mods that still consume plain org.joml.
 */
def shadowRemapJar = tasks.register('shadowRemapJar', ShadowJar) {
    group = 'build'
    description = 'Builds the production mod jar with the upstream shadow layout (relocated joml).'
    dependsOn tasks.named('reobfJar')
    archiveClassifier.set('')
    configurations.set([project.configurations.shadowBundle])
    from(zipTree(tasks.named('reobfJar').flatMap { it.output }))
    relocate('org.joml', 'dhj.embeddedt.embeddium.impl.shadow.joml')
    mergeServiceFiles()
    // Written here rather than inherited: the attributes are computed when the task runs, and a jar task
    // that is up to date never runs its doFirst, which would leave an inherited Manifest object empty.
    doFirst {
        manifest {
            applyActiniumManifest(delegate)
        }
    }
}

// reobfJar is the MCP -> SRG intermediate here, not the distributed artifact, so it must not claim the
// unclassified build/libs/<name>-<version>.jar that shadowRemapJar writes.
tasks.named('reobfJar') {
    archiveClassifier.set('reobf')
}

// The Shadow plugin's default shadowJar produces an unremapped -all.jar that the project
// does not distribute; the production artifact is shadowRemapJar.
tasks.named('shadowJar') {
    enabled = false
}

/**
 * Chunk Animator's dev-environment coremod (MCPNames) reads ./../mcp/methods.csv and
 * ./../mcp/fields.csv relative to the client run directory and crashes at class init when they
 * are missing. The mappings come from the same mcp_stable artifact the userdev pipeline targets.
 */
def chunkAnimatorMcpMappingsDir = layout.projectDirectory.dir('run/mcp').asFile

def mcpStableMappings = configurations.create('mcpStableMappings') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}

dependencies {
    add(mcpStableMappings.name, 'de.oceanlabs.mcp:mcp_stable:39-1.12@zip')
}

def prepareChunkAnimatorMcpMappings = tasks.register('prepareChunkAnimatorMcpMappings') {
    group = 'build'
    description = 'Copies MCP stable_39 mappings into the run directory for Chunk Animator dev compatibility.'
    inputs.files(mcpStableMappings)
    outputs.dir(chunkAnimatorMcpMappingsDir)
    outputs.upToDateWhen { false }

    doLast {
        def mappingsArchive = mcpStableMappings.singleFile
        if (!mappingsArchive.isFile()) {
            throw new GradleException("Could not locate the MCP stable_39 mappings archive: ${mappingsArchive}")
        }
        if (!chunkAnimatorMcpMappingsDir.exists() && !chunkAnimatorMcpMappingsDir.mkdirs()) {
            throw new GradleException("Failed to create MCP mappings directory: ${chunkAnimatorMcpMappingsDir}")
        }
        copy {
            from zipTree(mappingsArchive)
            include 'methods.csv', 'fields.csv'
            into chunkAnimatorMcpMappingsDir
        }
    }
}

