    contain
    implementation.extendsFrom(contain)
    // External classes bundled into the mod jar body under the shared shadow namespace, mirroring
    // the upstream Celeritas distribution layout. Kept separate from implementation so the plain
    // namespace jars stay on the compile/dev classpath for third-party mods that need them.
    shadowBundle
}

// Shared dependency versions, read by the subprojects block below and by gradle/scripts/dependencies.gradle.
// LWJGL follows the generation the Cleanroom userdev ships (see cleanroom_version), so the modules and
// the host agree on the native/core pair.
ext.lombokVersion = '1.18.46'
ext.asmVersion = '9.9.1'
ext.lwjglVersion = '3.4.3'

