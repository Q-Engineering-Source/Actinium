# Gradle Properties
org.gradle.jvmargs = -Xmx8G -XX:MaxDirectMemorySize=8G -XX:+UseZGC -XX:+AlwaysPreTouch
org.gradle.workers.max = 2
org.gradle.caching = true

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# CleanroomGradle
# Cleanroom version the userdev workspace is built from; read by build.gradle and every subproject.
cleanroom_version = 0.7.4-alpha
# Name of the Mixin refmap the configs in src/main/resources point at. Setting it makes the plugin add
# the Mixin annotation processors and write the refmap into the compiled classes, so both jars carry it.
cg.userdev.refmap = mixins.actinium-refmap.json

# Testing
enable_junit_testing = true
show_testing_output = false

# JMH benchmarks (celeritas-common/src/jmh)
jmh_version = 1.37

# Compile-time LWJGL2 compatibility layer.
# The same Actinium jar has to run on both Cleanroom generations:
#   - an older Cleanroom, whose LWJGL2 API lives in org.lwjgl.** (com.cleanroommc:lwjglx) with the
#     lwjgl3ify-style shims in org.lwjglx.** (com.cleanroommc:lwjglxx);
#   - a newer Cleanroom running LWJGLY (com.cleanroommc:lwjgly), which has no org.lwjglx.** at all,
#     returns null from Display.getDrawable() and has no Drawable model.
# Compiling against lwjglx covers both: it is the wider API surface (org.lwjgl.** plus
# org.lwjglx.**), and every org.lwjgl.** member the mod uses also exists in LWJGLY. Nothing in the
# mod needs org.lwjglx-only API any more, and LWJGLY-only API is confined to one isolated class
# that is loaded only after a class-presence check says LWJGLY is installed. The userdev brings
# LWJGLY along, and build.gradle subtracts it from the compile/test classpaths so lwjglx's copy
# of org.lwjgl.** wins there; the dev run keeps LWJGLY.
# WARNING: LWJGL2 is not recommended and some methods are unavailable on LWJGLY.
# If you are porting an old mod lazily just set this to true.
enable_lwjgl_compat = true

# Mod Information
mod_version = alpha-0.0.3
root_package = org.taumc
mod_id = actinium
mod_name = Actinium

# Mod Metadata (Optional)
mod_description = Modern rendering and shader compatibility for Minecraft 1.12.2 on Cleanroom Loader.
mod_url = https://github.com/DHJComical/Actinium
mod_update_json =
mod_authors = embeddedt, DHJComical
mod_credits = The Sodium project, Celeritas, GLSM, GTNHLib, Iris, GLSL Transformation Library, Angelica
mod_logo_path = assets/actinium/icon.png

# Run Configurations
# If multiple arguments/tweak classes are stated, use spaces as the delimiter
minecraft_username = Developer
# HBM-CE compatibility (issue #64): MixinDefaultChunkRenderer is adapted via
# DefaultChunkRenderer.fillCommandBuffer, but MixinOcclusionCuller still targets
# the old Celeritas OcclusionCuller API (isSectionVisible / isWithinFrustum(Viewport,
# OcclusionNode)) that Actinium's rewritten renderer does not provide. ignoreConstraints
# downgrades those Critical injection failures to skips instead of poisoning the
# target class and breaking world loading (issue #47 player-null crash).
extra_jvm_args = -Dmixin.env.ignoreConstraints=true

# Maven Publishing (Provide secret: MAVEN_USER, MAVEN_PASS)
publish_to_maven = false
# Good for debugging artifacts before uploading to remote maven
# GitHub actions won't run if this is true, test this by running the task `publishToMavenLocal`
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# If any properties changes below this line, refresh gradle again to ensure everything is working correctly.
# ----------------------------------------------------------------------------------------------------------------------

# Access Transformers
# A way to change visibility of Minecraft's classes, methods and fields
# An example access transformer file is given in the path: `src/main/resources/example_at.cfg`
# AT files should be in the root of src/main/resources with the filename formatted as: `mod_id_at.cfg`
# Use the property `access_transformer_locations` to state custom AT files if you aren't using the default `mod_id_at.cfg` location
# If multiple locations are stated, use spaces as the delimiter
# Use SRG member names (field_/func_) in AT files: CleanroomGradle applies the file to the SRG-named
# Minecraft jar when it materializes the userdev classes and ships it unchanged for the FMLAT pass.
use_access_transformer = true
access_transformer_locations = META-INF/actinium_at.cfg

# Coremods
# The most powerful way to change java classes at runtime, it is however very primitive with little documentation.
# Only make a coremod if you are absolutely sure of what you are doing
# Change the property `coremod_includes_mod` to false if your coremod doesn't have a @Mod annotation
# You MUST state a class name for `coremod_plugin_class_name` if you are making a coremod, the class should implement `IFMLLoadingPlugin`
is_coremod = true
coremod_includes_mod = true
coremod_plugin_class_name = com.dhj.actinium.mixins.MixinEarly
