plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir '../src/lwjglCommon/java'
            srcDir '../src/lwjgl3/java'
        }
    }
}

dependencies {
    api project(':GTNHLib')
    // SPIR-V toolchain for the future sdl-gpu backend (compile-time only; natives ship with that backend).
    compileOnly 'org.lwjgl:lwjgl-sdl:3.4.1'
    compileOnly 'org.lwjgl:lwjgl-shaderc:3.4.1'
    compileOnly 'org.lwjgl:lwjgl-spvc:3.4.1'
}
