plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.cleanroommc.com' }
    // LWJGLY's SPI (com.cleanroommc:lwjgly-spi) is published here, not on maven.cleanroommc.com.
    maven { url = 'https://repo.cleanroommc.com/releases' }
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
    maven { url = 'https://maven.arcseekers.com/releases' }
    mavenLocal()
}

// The SDL GPU shaders live in the root project resources (they ship with the mod jar), so the
// module's tests need that subtree on their runtime classpath to compile them.
sourceSets {
    test {
        resources {
            srcDir '../src/main/resources'
            include 'assets/angelica/shaders/**'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    api project(':glsm')

    compileOnly project(':celeritas-common')
    compileOnly project(':GTNHLib')

    // GL enum constants (compileOnly -- no runtime GL dependency)
    compileOnly 'org.lwjgl:lwjgl-opengl:3.4.1'

    // LWJGL2 compatibility layer for the older Cleanroom generation: this module's resident code
    // uses org.lwjgl.** (LWJGL 2's API), which lwjglx and LWJGLY both provide. It carries the
    // org.lwjglx.** shims as well, but nothing here uses them.
    compileOnly 'com.cleanroommc:lwjglx:1.0.0'
    // LWJGLY's SPI: com.cleanroommc.lwjgly.LWJGLY and its WindowBridge, which a newer Cleanroom
    // installs. Referenced by one class (compat/lwjgly/LwjglyWindowHost) that is loaded only after
    // a class-presence check says LWJGLY is installed.
    compileOnly 'com.cleanroommc:lwjgly-spi:1.0.0'

    // LWJGL3 core + SDL3 GPU + SPIRV-Cross + shaderc
    implementation 'org.lwjgl:lwjgl-sdl:3.4.1'
    implementation 'org.lwjgl:lwjgl-spvc:3.4.1'
    implementation 'org.lwjgl:lwjgl-shaderc:3.4.1'
    ['windows', 'linux', 'macos'].each { platform ->
        runtimeOnly "org.lwjgl:lwjgl-sdl:3.4.1:natives-$platform"
        runtimeOnly "org.lwjgl:lwjgl-spvc:3.4.1:natives-$platform"
        runtimeOnly "org.lwjgl:lwjgl-shaderc:3.4.1:natives-$platform"
    }

    compileOnly 'org.apache.logging.log4j:log4j-api:2.24.3'
    compileOnly 'org.jetbrains:annotations:24.0.0'
    compileOnly 'it.unimi.dsi:fastutil:8.5.15'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.24.3'
    testImplementation 'it.unimi.dsi:fastutil:8.5.15'
    testImplementation 'com.google.guava:guava:21.0'
    testImplementation 'org.lwjgl:lwjgl-opengl:3.4.1'
    testImplementation(testFixtures(project(':glsm')))
    // Main code only compiles against celeritas-common, but the shader-carrying tests load ShaderLoader at runtime.
    testImplementation project(':celeritas-common')
    // GLSL parse/transform library (same artifact the mod contains; needed at test compile time)
    testImplementation('org.taumc:glsl-transformation-lib:0.2.0-32.g7dd88a4-GTNH') {
        transitive = false
        exclude module: 'antlr4'
    }
    testImplementation 'org.antlr:antlr4-runtime:4.13.2'
    ['windows', 'linux', 'macos'].each { platform ->
        testRuntimeOnly "org.lwjgl:lwjgl:3.4.1:natives-$platform"
        testRuntimeOnly "org.lwjgl:lwjgl-opengl:3.4.1:natives-$platform"
    }
}

tasks.test {
    useJUnitPlatform()
}
