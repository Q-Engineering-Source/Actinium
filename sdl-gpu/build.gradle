plugins {
    id 'java-library'
    id 'com.cleanroommc.cleanroomgradle'
}

repositories {
    // org.taumc:glsl-transformation-lib
    maven { url = 'https://nexus.gtnewhorizons.com/repository/public/' }
}

// The SDL GPU shaders live in the root project resources (they ship with the mod jar), so the
// module's tests need that subtree on their runtime classpath to compile them.
sourceSets {
    test {
        resources {
            srcDir '../src/main/resources'
            include 'assets/angelica/shaders/**'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    // See the root project: the userdev dependency publishes JVM 25 variants only, so the modules must
    // not pin source/targetCompatibility to 21; options.release keeps the bytecode at 21.
}

def lwjglVersion = rootProject.ext.lwjglVersion

dependencies {
    // Minecraft, the loader and the Mixin runtime, materialized from Cleanroom by the userdev.
    compileOnly cleanroom.userdev(rootProject.property('cleanroom_version')) {
        if (rootProject.ext.actiniumAccessTransformer != null) {
            accessTransformers.from(rootProject.ext.actiniumAccessTransformer)
        }
    }

    api project(':glsm')

    compileOnly project(':celeritas-common')
    compileOnly project(':GTNHLib')

    // GL enum constants (compileOnly -- no runtime GL dependency)
    compileOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}"

    // LWJGL2 compatibility layer: this module's resident code uses org.lwjgl.** (LWJGL 2's API), which
    // the compileClasspath in the shared configuration supplies and the host provides at runtime.
    // LWJGLY's SPI: com.cleanroommc.lwjgly.LWJGLY and its WindowBridge, which a newer Cleanroom
    // installs. Referenced by one class (compat/lwjgly/LwjglyWindowHost) that is loaded only after
    // a class-presence check says LWJGLY is installed.
    compileOnly 'com.cleanroommc:lwjgly-spi:1.0.0'

    // LWJGL3 core + SDL3 GPU + SPIRV-Cross + shaderc
    implementation "org.lwjgl:lwjgl-sdl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-spvc:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-shaderc:${lwjglVersion}"
    ['windows', 'linux', 'macos'].each { platform ->
        runtimeOnly "org.lwjgl:lwjgl-sdl:${lwjglVersion}:natives-$platform"
        runtimeOnly "org.lwjgl:lwjgl-spvc:${lwjglVersion}:natives-$platform"
        runtimeOnly "org.lwjgl:lwjgl-shaderc:${lwjglVersion}:natives-$platform"
    }

    compileOnly 'org.apache.logging.log4j:log4j-api:2.24.3'
    compileOnly 'org.jetbrains:annotations:24.0.0'
    compileOnly 'it.unimi.dsi:fastutil:8.5.15'

    // GLSL source transformation used by the pipeline's shader translator.
    compileOnly('org.taumc:glsl-transformation-lib:0.2.0-32.g7dd88a4-GTNH') {
        transitive = false
        exclude module: 'antlr4'
    }
    compileOnly 'org.antlr:antlr4-runtime:4.13.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.24.3'
    testImplementation 'it.unimi.dsi:fastutil:8.5.15'
    testImplementation 'com.google.guava:guava:21.0'
    testImplementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    testImplementation(testFixtures(project(':glsm')))
    // Main code only compiles against celeritas-common, but the shader-carrying tests load ShaderLoader at runtime.
    testImplementation project(':celeritas-common')
    // GLSL parse/transform library (same artifact the mod contains; needed at test compile time)
    testImplementation('org.taumc:glsl-transformation-lib:0.2.0-32.g7dd88a4-GTNH') {
        transitive = false
        exclude module: 'antlr4'
    }
    testImplementation 'org.antlr:antlr4-runtime:4.13.2'
    ['windows', 'linux', 'macos'].each { platform ->
        testRuntimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-$platform"
        testRuntimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-$platform"
    }
}

tasks.test {
    useJUnitPlatform()
}
