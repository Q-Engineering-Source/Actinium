apply from: 'gradle/scripts/helpers.gradle'

setDefaultProperty 'publish_to_maven', true, false

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            setGroupId(project.group)
            setVersion(project.version)
            setArtifactId('Actinium')
        }
    }
}

tasks.named('generateMetadataFileForMavenJavaPublication') {
    dependsOn tasks.named('shadowRemapJar')
}

// The published jar path (build/libs/<archivesName>-<version>.jar with an empty classifier) is
// written by 'shadowRemapJar' (the production shadow-layout jar), while the plain 'jar' task writes
// the MCP-classified build/libs/<archivesName>-<version>-mcp.jar and 'reobfJar' the SRG intermediate
// under -reobf. Publish tasks consume the distributed file, and Gradle 9 fails the build on its
// implicit-dependency validation unless the producing task is declared here.
tasks.matching { it.name.startsWith('publishMavenJavaPublicationTo') }.configureEach {
    dependsOn tasks.named('shadowRemapJar')
}

if (propertyBool('publish_to_maven')) {
    assertProperty 'maven_name'
    assertProperty 'maven_url'
    publishing {
        repositories {
            maven {
                name propertyString('maven_name').replaceAll('\\s', '')
                url propertyString('maven_url')
                credentials(PasswordCredentials)
            }
        }
    }
}
