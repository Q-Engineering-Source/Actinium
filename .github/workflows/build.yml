name: Build mod jar

on:
  workflow_dispatch:
  push:
  # Pull requests need an explicit trigger: pushes to a fork never reach this
  # repository, so without it a contribution gets no build at all.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        # Full history + tags: the build derives the version prefix from the nearest git tag
        # (git describe), which fails on the default shallow checkout and silently falls back
        # to gradle.properties mod_version.
        fetch-depth: 0
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: 9.7.1
      name: Set up Gradle
    - name: Add permission
      run: chmod +x ./gradlew
    - name: Execute Gradle build
      run: ./gradlew build
        
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        path: build/libs
