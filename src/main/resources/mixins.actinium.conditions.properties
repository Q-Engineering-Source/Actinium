# Late/conditional mixin configs and the requirements that gate them.
# Format: <config name>=<requirements>
# Comma-separated requirements form an AND group; '|' separates alternative groups.
# A requirement is a mod id, class:<binary name> to probe for a class resource, or the
# dedicated dh-buffer-diagnostics token that checks the optional DH GLBuffer hook ABI.
# A config loads when ANY group is fully present.
# Kept separate from the mixin json files: the mixin loader does not accept custom fields.
mixins.actinium.gibbed.json=gibbed
mixins.actinium.ichunutil.json=ichunutil
mixins.actinium.lumenized.json=class:gregtech.client.utils.BloomEffectUtil
mixins.actinium.revoui.json=neofontrender_ui_enhancements
mixins.actinium.betterfoliage.json=betterfoliage,class:mods.betterfoliage.client.Hooks
mixins.actinium.rlfoliage.json=betterfoliage,class:betterfoliage.render.feature.RenderingHandler
mixins.actinium.ccl.json=codechickenlib
mixins.actinium.voxelmap.json=voxelmap
mixins.actinium.extrautils2.json=extrautils2
mixins.actinium.cofhcore.json=cofhcore
mixins.actinium.oldresearch.json=oldresearch
mixins.actinium.botania.json=botania
mixins.actinium.hbm.json=hbm
mixins.actinium.gvclib.json=gvclib
mixins.actinium.storagedrawers.json=storagedrawers
mixins.actinium.scannable.json=scannable
mixins.actinium.littletiles.json=littletiles
mixins.actinium.architecturecraft.json=architecturecraft,class:com.elytradev.architecture.client.render.target.RenderTargetWorld
mixins.actinium.obscuretooltips.json=obscure_tooltips
mixins.actinium.dsurround.json=dsurround
mixins.actinium.distanthorizons.json=distanthorizons,dh-buffer-diagnostics
